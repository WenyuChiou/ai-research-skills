name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest pyyaml jsonschema
      - name: Run catalog tests
        run: python -m pytest tests/ -q
      - name: Check catalog <-> marketplace consistency
        run: python scripts/check_marketplace_consistency.py
      - name: Check catalog YAML against schema
        run: python scripts/check_catalog_schema.py
