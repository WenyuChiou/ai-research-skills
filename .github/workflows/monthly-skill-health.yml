name: Monthly skill health report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 1 * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-skill-health
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        continue-on-error: true
        with:
          python-version: "3.12"
      - id: dependencies
        continue-on-error: true
        run: python -m pip install PyYAML==6.0.3
      - name: Run report-only health checks
        id: health
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/check_skill_health.py --json-output skill-health-report.json
          health_exit=$?
          python scripts/check_skill_drift.py --max-age-days 120 > skill-drift-report.txt 2>&1
          drift_exit=$?
          if [ ! -s skill-health-report.json ]; then
            printf '{"status":"checker_crash","skills_checked":0,"repositories_checked":0,"findings":[{"severity":"error","check":"checker_crash","target":"check_skill_health.py","detail":"exit %s"}]}\n' "$health_exit" > skill-health-report.json
          fi
          if [ ! -s skill-drift-report.txt ]; then
            printf 'RESULT: CHECKER_CRASH (check_skill_drift.py exit %s)\n' "$drift_exit" > skill-drift-report.txt
          fi
          printf 'health_exit=%s\ndrift_exit=%s\n' "$health_exit" "$drift_exit" > skill-health-exits.txt
      - name: Upload immutable report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-health-${{ github.run_id }}
          path: |
            skill-health-report.json
            skill-drift-report.txt
            skill-health-exits.txt
      - name: Reconcile the exact human-review issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          title = "[skill-health] Human review required"
          label = "skill-health"
          run_url = os.environ["RUN_URL"]

          try:
              report = json.loads(Path("skill-health-report.json").read_text(encoding="utf-8"))
          except Exception as exc:
              report = {
                  "status": "checker_crash",
                  "findings": [{"severity": "error", "check": "report_parse", "detail": type(exc).__name__}],
              }
          drift = Path("skill-drift-report.txt").read_text(encoding="utf-8", errors="replace") if Path("skill-drift-report.txt").exists() else "RESULT: CHECKER_CRASH"
          exits = Path("skill-health-exits.txt").read_text(encoding="utf-8", errors="replace") if Path("skill-health-exits.txt").exists() else "health_exit=missing\ndrift_exit=missing\n"
          needs_review = (
              report.get("status") != "pass"
              or "RESULT: PASS" not in drift
              or "health_exit=0" not in exits
              or "drift_exit=0" not in exits
          )

          subprocess.run(
              ["gh", "label", "create", label, "--color", "B60205", "--description", "Automated report requires human review", "--force"],
              check=True,
          )
          listed = subprocess.run(
              ["gh", "issue", "list", "--state", "all", "--label", label, "--limit", "100", "--json", "number,title,state"],
              check=True,
              capture_output=True,
              text=True,
          )
          exact = [issue for issue in json.loads(listed.stdout) if issue["title"] == title]
          issue = exact[0] if exact else None

          if not needs_review:
              if issue and issue["state"] == "OPEN":
                  subprocess.run(
                      ["gh", "issue", "close", str(issue["number"]), "--comment", f"Recovered: the latest report passed. Run: {run_url}"],
                      check=True,
                  )
              raise SystemExit(0)

          body = (
              "The report-only monthly check needs human review. No auto-fix, PR, merge, "
              "publication, installation, or deletion was performed.\n\n"
              f"Run: {run_url}\n\n"
              "```json\n" + json.dumps(report, indent=2, ensure_ascii=False) + "\n```\n\n"
              "```text\n" + drift[-12000:] + "\n```\n\n"
              "```text\n" + exits + "```\n"
          )
          if issue:
              if issue["state"] != "OPEN":
                  subprocess.run(["gh", "issue", "reopen", str(issue["number"])], check=True)
              subprocess.run(["gh", "issue", "edit", str(issue["number"]), "--body", body, "--add-label", label], check=True)
          else:
              subprocess.run(["gh", "issue", "create", "--title", title, "--body", body, "--label", label], check=True)
          PY
